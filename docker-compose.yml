networks:
  dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 10.1.80.0/27     # 10.1.80.1-30 usable (.0 red, .31 broadcast)

services:
  dns:
    build: ./bind
    container_name: dns
    hostname: dns
    networks:
      dmz:
        ipv4_address: 10.1.80.6    # dns.misiotic.com
    ports:
      - "5353:53/tcp"
      - "5353:53/udp"
    volumes:
      - ./bind:/etc/bind:ro
    healthcheck:
      test: ["CMD-SHELL", "dig @127.0.0.1 misiotic.com +short | grep -q 10.1.80.2"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Hosts de la DMZ (solo para probar A/PTR)
  www:
    build: ./alpine-host
    container_name: www
    hostname: www
    networks:
      dmz:
        ipv4_address: 10.1.80.2
    dns:
      - 10.1.80.6
    command: ["sh", "-c", "sleep infinity"]

  proxy:
    build: ./alpine-host
    container_name: proxy
    hostname: proxy
    networks:
      dmz:
        ipv4_address: 10.1.80.3
    dns:
      - 10.1.80.6
    command: ["sh", "-c", "sleep infinity"]

  mail:
    build: ./alpine-host
    container_name: mail
    hostname: mail
    networks:
      dmz:
        ipv4_address: 10.1.80.4
    dns:
      - 10.1.80.6
    command: ["sh", "-c", "sleep infinity"]

  file:
    build: ./alpine-host
    container_name: file
    hostname: file
    networks:
      dmz:
        ipv4_address: 10.1.80.5
    dns:
      - 10.1.80.6
    command: ["sh", "-c", "sleep infinity"]

  # Cliente de pruebas
  tester:
    build: ./alpine-host
    container_name: tester
    hostname: tester
    networks:
      dmz:
        ipv4_address: 10.1.80.20
    dns:
      - 10.1.80.6
    command: ["sh", "-c", "sleep infinity"]
